<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Livros & Avaliações - CRUD Supabase</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 24px 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    header p {
      color: #64748b;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      color: #334155;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 8px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    .campo.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #475569;
    }

    input, select, textarea {
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #4f46e5;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .botoes-form {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-salvar {
      background: #4f46e5;
      color: #ffffff;
    }

    .btn-salvar:hover {
      background: #4338ca;
    }

    .btn-cancelar {
      background: #94a3b8;
      color: #ffffff;
    }

    .btn-cancelar:hover {
      background: #64748b;
    }

    .tabela-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.92rem;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
    }

    tr:hover {
      background: #f8fafc;
    }

    .badge-status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-lido {
      background: #dcfce7;
      color: #15803d;
    }

    .status-lendo {
      background: #e0e7ff;
      color: #4338ca;
    }

    .status-quero-ler {
      background: #fef3c7;
      color: #b45309;
    }

    .nota-estrelas {
      color: #f59e0b;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .btn-acao {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      margin-right: 4px;
    }

    .btn-editar {
      background: #e2e8f0;
      color: #1e293b;
    }

    .btn-editar:hover {
      background: #cbd5e1;
    }

    .btn-excluir {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-excluir:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .aviso-vazio {
      text-align: center;
      padding: 24px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📚 Meus Livros & Avaliações</h1>
      <p>Acompanhe suas leituras, defina status e dê notas aos seus livros</p>
    </header>

    <!-- Formulário de Cadastro / Edição -->
    <section class="card">
      <h2 id="tituloForm">Avaliar / Registrar Livro</h2>
      <form id="livroForm">
        <input type="hidden" id="idLivro" />

        <div class="campo">
          <label for="titulo">Título da Obra *</label>
          <input type="text" id="titulo" required placeholder="Ex: Dom Casmurro" />
        </div>

        <div class="campo">
          <label for="autor">Autor *</label>
          <input type="text" id="autor" required placeholder="Ex: Machado de Assis" />
        </div>

        <div class="campo">
          <label for="genero">Gênero Literário</label>
          <input type="text" id="genero" placeholder="Ex: Romance" />
        </div>

        <div class="campo">
          <label for="status">Status de Leitura</label>
          <select id="status">
            <option value="Quero Ler">Quero Ler</option>
            <option value="Lendo">Lendo</option>
            <option value="Lido">Lido</option>
          </select>
        </div>

        <div class="campo">
          <label for="nota">Sua Nota (1 a 5)</label>
          <select id="nota">
            <option value="">Sem nota</option>
            <option value="5">⭐⭐⭐⭐⭐ (5 - Excelente)</option>
            <option value="4">⭐⭐⭐⭐ (4 - Muito bom)</option>
            <option value="3">⭐⭐⭐ (3 - Bom)</option>
            <option value="2">⭐⭐ (2 - Regular)</option>
            <option value="1">⭐ (1 - Fraco)</option>
          </select>
        </div>

        <div class="campo full-width">
          <label for="resenha">Opinião / Anotação</label>
          <textarea id="resenha" placeholder="O que achou deste livro?"></textarea>
        </div>

        <div class="botoes-form">
          <button type="submit" class="btn-salvar" id="btnSalvar">Salvar Avaliação</button>
          <button type="button" class="btn-cancelar" id="btnCancelar" style="display: none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Tabela -->
    <section class="card">
      <h2>Estante de Leituras</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Livro</th>
              <th>Autor</th>
              <th>Status</th>
              <th>Avaliação</th>
              <th>Opinião / Resenha</th>
              <th style="min-width: 140px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaLivros">
            <tr>
              <td colspan="7" class="aviso-vazio">Iniciando conexão...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Apenas estes dois scripts no final do arquivo: -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
